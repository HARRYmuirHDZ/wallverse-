name: wallverse
description: "WallVerse – HD, 4K & 8K Wallpapers"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.3.0
  cloud_firestore: ^5.2.0
  firebase_storage: ^12.1.0
  image_picker: ^1.1.2

  # Ads
  google_mobile_ads: ^5.1.0

  # Image loading & caching
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1

  # State management
  provider: ^6.1.2

  # Sharing
  share_plus: ^10.0.0

  # File & path utils
  path_provider: ^2.1.4
  http: ^1.2.2

  # Permissions
  permission_handler: ^11.3.1

  # Loading animations
  shimmer: ^3.0.0

  # Staggered grid
  flutter_staggered_grid_view: ^0.7.0

  # Shared preferences for language storage
  shared_preferences: ^2.3.2

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#0A0A1A"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/images/
